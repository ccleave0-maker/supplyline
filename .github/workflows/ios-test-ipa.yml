# Builds an unsigned iPhone test app (.ipa) on a GitHub Mac, for sideloading.
# Run it from GitHub › Actions › "iPhone test app" › Run workflow, then download the
# "Bowron-ipa" file from the finished run. Install it with Sideloadly (Windows),
# which signs it with your own Apple ID. Nothing here needs keys or an Apple developer account.
name: iPhone test app
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Where the Bowron server runs, as the phone sees it (e.g. http://192.168.1.72:4000 or your https server)'
        required: true
        default: 'http://192.168.1.72:4000'

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @supplyline/app-ios...

      - name: Build the app's screens
        working-directory: apps/ios
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url }}

      - name: Make the Xcode project
        working-directory: apps/ios
        run: |
          [ -d ios ] || pnpm exec cap add ios
          pnpm exec cap sync ios

      # Why the app asks for each permission. iOS closes an app that uses the camera,
      # photos or microphone without these.
      - name: Permission wording
        working-directory: apps/ios/ios/App/App
        run: |
          set_key() { /usr/libexec/PlistBuddy -c "Set :$1 $2" Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string $2" Info.plist; }
          set_key NSCameraUsageDescription "Bowron uses the camera to scan QR codes and take photos of deliveries, packing slips and damage."
          set_key NSPhotoLibraryUsageDescription "Bowron lets you attach photos already on your phone, like packing slips and receipts."
          set_key NSPhotoLibraryAddUsageDescription "Bowron can save photos you take to your library."
          set_key NSMicrophoneUsageDescription "Bowron uses the microphone when you tap the mic to speak to the assistant or record a meeting."
          set_key NSSpeechRecognitionUsageDescription "Bowron turns what you say into text when you use voice commands."
          # Phones only show it upright; iPads can turn.
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" Info.plist || true

      # Test build only: let the app talk to a plain-http server on your network.
      - name: Allow the test server
        working-directory: apps/ios/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Bowron connects to your Bowron server on this network.'" Info.plist || true

      - name: Compile (unsigned)
        working-directory: apps/ios/ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package the .ipa
        working-directory: apps/ios/ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Bowron-test.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Bowron-ipa
          path: apps/ios/ios/App/Bowron-test.ipa
          retention-days: 14
