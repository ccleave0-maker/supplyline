# Runs every check on each push and pull request: types + all automated tests
# against a throw-away PostgreSQL. Nothing here needs your real keys.
name: CI
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: supplyline
          POSTGRES_PASSWORD: supplyline
          POSTGRES_DB: supplyline_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U supplyline" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Test-only values (not secrets): a local throw-away database and dummy keys.
      DATABASE_URL: postgresql://supplyline:supplyline@localhost:5432/supplyline_test
      TEST_DATABASE_URL: postgresql://supplyline:supplyline@localhost:5432/supplyline_test
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else-0123456789
      ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
