# Deploy: push to "staging" → staging; push to "main" → production.
# Runs the tests, then applies database changes. Railway deploys the new version after
# this workflow passes (Railway › service › Settings › "Wait for CI" is on).
# Set in GitHub › Settings › Environments (staging / production) › Secrets:
#   DATABASE_URL     that environment's database (Supabase › Connect › direct/session URL)
name: Deploy
on:
  push:
    branches: [main, staging]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  migrate:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @supplyline/server...
      - name: Apply database changes
        run: pnpm --filter @supplyline/server exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
