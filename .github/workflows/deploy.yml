# Deploy: push to the "staging" branch → staging; push to "main" → production.
# Runs the tests, applies database changes, then tells the host to deploy.
# Set these in GitHub › Settings › Environments (staging / production) › Secrets:
#   DATABASE_URL     the database for that environment
#   DEPLOY_HOOK_URL  the host's deploy hook (Render › service › Settings › Deploy Hook)
name: Deploy
on:
  push:
    branches: [main, staging]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @supplyline/server...
      - name: Apply database changes
        run: pnpm --filter @supplyline/server exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
